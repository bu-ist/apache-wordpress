# PHP OPcache Configuration
# Based on optimized settings from Phase 2 cleanup
# Last updated: Nov 19, 2025

<IfModule mod_php7.c>
    # Optimized OPcache settings
    php_admin_value opcache.enable 1
    php_admin_value opcache.enable_cli 1
    php_admin_value opcache.memory_consumption 512
    php_admin_value opcache.max_accelerated_files 200000
    php_admin_value opcache.validate_timestamps 1
    php_admin_value opcache.revalidate_freq 2
    php_admin_value opcache.revalidate_path 1
    php_admin_value opcache.file_update_protection 2
    php_admin_value opcache.interned_strings_buffer 16
    php_admin_value opcache.save_comments 1
    php_admin_value opcache.enable_file_override 1
    php_admin_value opcache.file_cache_only 0
    php_admin_value opcache.huge_code_pages 0

    # OPcache settings are primarily managed through .ini files in /etc/php.d/
    # See php.d/README.md for the 4-file configuration structure
</IfModule>