# Loopback-only php2shell mitigation check (apache-php2shell-mitigate.sh). Same access rules as
# zz-opcache-endpoint.conf: Require local after mod_remoteip, plus the TCP peer itself.
Alias /__php2shell-check.php /usr/local/share/bu-php2shell/check.php
<Directory /usr/local/share/bu-php2shell>
    AllowOverride None
    Options None
    <RequireAll>
      Require local
      Require expr %{CONN_REMOTE_ADDR} -ipmatch '127.0.0.0/8'
    </RequireAll>
</Directory>
<Location "/__php2shell-check.php">
  <RequireAll>
    Require local
    Require expr %{CONN_REMOTE_ADDR} -ipmatch '127.0.0.0/8'
  </RequireAll>
  php_value auto_prepend_file none
  php_value auto_append_file none
</Location>
