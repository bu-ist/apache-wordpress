# Compress text responses. mod_deflate adds Vary: Accept-Encoding itself and only acts on status 200.
# CSS, JavaScript and SVG are left out: in httpd 2.4.6 the -gzip ETag suffix turns every revalidation
# of a static file into a full 200.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml application/xml application/json application/rss+xml application/atom+xml application/rdf+xml
    DeflateCompressionLevel 5
    # Pages that carry nonces and reflect input stay uncompressed (BREACH).
    <LocationMatch "/wp-(admin/|login\.php)">
        SetEnv no-gzip 1
    </LocationMatch>
</IfModule>
