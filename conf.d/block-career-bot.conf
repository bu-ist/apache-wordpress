# Block distributed bot hammering /com-careers/
# All external traffic to this path is bot — no referer, rotating IPs
<LocationMatch "^/com-careers/">
    <RequireAll>
        Require all granted
        # Allow Webrouter/internal IPs
        Require not ip 0.0.0.0/8
        Require not ip 10.0.0.0/8
        Require not ip 127.0.0.0/8
        Require not ip 172.16.0.0/12
        Require not ip 192.168.0.0/16
        Require not ip ::1
    </RequireAll>
</LocationMatch>
