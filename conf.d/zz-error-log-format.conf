# Error-log timestamps in compact ISO 8601, so log tools read the whole timestamp as one field.
# Other fields follow Apache 2.4's built-in error log format, except that proxy back-end
# connections are labelled [client ip:port] where the built-in format writes [remote ip:port].
ErrorLogFormat "[%{cu}t] [%-m:%l] [pid %P] %7F: %E: [client\ %a] %M% ,\ referer:\ %{Referer}i"
