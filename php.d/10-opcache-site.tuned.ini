; --- OPcache: PROD tuned (symlink-friendly, minimal change) ---
opcache.enable=1
opcache.enable_cli=0               ; prevent wp-cli from polluting cache
opcache.memory_consumption=512
opcache.max_accelerated_files=200000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.revalidate_path=1          ; safe with symlinked deploys
opcache.file_update_protection=2   ; keep race protection
; Realpath cache helps large WP trees
realpath_cache_size=4096K
realpath_cache_ttl=300
