# Host-side OPcache endpoint (status on GET, reset on POST). Loopback only. The script lives outside the
# release tree, so deploys never touch it.
# `Require local` tests the client address after mod_remoteip rewrites it from X-Forwarded-For, so a host in
# RemoteIPInternalProxy could send X-Forwarded-For: 127.0.0.1 and pass it. The second condition tests the
# TCP peer itself, which a header cannot change.
Alias /__opcache.php /usr/local/share/bu-opcache/opcache.php
<Directory /usr/local/share/bu-opcache>
    AllowOverride None
    Options None
    <RequireAll>
      Require local
      Require expr %{CONN_REMOTE_ADDR} -ipmatch '127.0.0.0/8'
    </RequireAll>
</Directory>
<Location "/__opcache.php">
  <RequireAll>
    Require local
    Require expr %{CONN_REMOTE_ADDR} -ipmatch '127.0.0.0/8'
  </RequireAll>
  php_value auto_prepend_file none
  php_value auto_append_file none
</Location>
