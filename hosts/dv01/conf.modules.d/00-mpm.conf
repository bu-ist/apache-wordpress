# Load the MPM prefork module
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so

# Apache MPM Prefork Configuration - Development Optimized
# Server: ist-wp-app-dv01.bu.edu
# Total RAM: 16GB
# Environment: Development (WordPress DEVL)
#
# CRITICAL DIFFERENCE FROM PRODUCTION:
# Dev workers consume ~246MB (vs 100MB in prod) due to debug overhead
# This config accounts for actual observed worker size and usage patterns
#
# 7-day analysis shows:
#   - Average: 33 workers, Peak: 72 workers
#   - Worker RAM: 246MB avg, 517MB peak
#   - Memory: 6.8GB avg, 8.9GB peak
#
# Calculation: (16384MB - 1536MB) / 250MB = 59 workers
# Set to 60 for clean number, covers observed peak with safety margin

<IfModule mpm_prefork_module>
    # Number of child processes created on startup
    # Higher than prod for dev responsiveness
    StartServers             8

    # Minimum number of idle child processes
    MinSpareServers          5

    # Maximum number of idle child processes
    # Lower than prod for faster scale-down during idle
    MaxSpareServers          15

    # CRITICAL: Maximum number of simultaneous requests
    # LOWER than prod despite more RAM due to 2.5x larger workers
    ServerLimit              60
    MaxRequestWorkers        60

    # Maximum requests per child before recycling
    # LOWER than prod - dev code has memory leaks, recycle faster
    MaxConnectionsPerChild   500
</IfModule>
