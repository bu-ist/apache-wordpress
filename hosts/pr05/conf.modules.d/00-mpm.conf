# Load the MPM prefork module
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so

# Apache MPM Prefork Configuration
# Generated: 2026-02-03 (Manual fix for pr05)
# Hostname: ist-wp-app-pr05.bu.edu
# Total RAM: 11G
#
# This configuration prevents memory exhaustion and swapping by limiting
# the maximum number of Apache workers based on available system RAM.
#
# Formula: (Total RAM - OS overhead) / Average worker size
# Worker size estimate: ~100MB (mod_php + WordPress)

<IfModule mpm_prefork_module>
    # Number of child processes created on startup
    StartServers             10

    # Minimum number of idle child processes
    MinSpareServers          5

    # Maximum number of idle child processes
    MaxSpareServers          18

    # CRITICAL: Maximum number of simultaneous requests
    # This prevents memory exhaustion and swapping
    ServerLimit              108
    MaxRequestWorkers        108

    # Maximum requests per child before recycling
    # This prevents memory leaks from accumulating
    MaxConnectionsPerChild   1000
</IfModule>
